plugins {
    id 'com.android.application'
}

// SIGNING_PROPERTIES points at a signing.properties kept outside the repo (storeFile, storePassword, keyAlias,
// keyPassword). Unset, release builds are signed with the debug key.
def releaseKey = null
def signingPath = System.getenv('SIGNING_PROPERTIES')
if (signingPath != null && file(signingPath).exists()) {
    releaseKey = new Properties()
    file(signingPath).withInputStream { releaseKey.load(it) }
}

android {
    namespace 'io.github.maxhayim.standbylight'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.maxhayim.standbylight'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        if (releaseKey != null) {
            release {
                storeFile file(releaseKey['storeFile'])
                storePassword releaseKey['storePassword']
                keyAlias releaseKey['keyAlias']
                keyPassword releaseKey['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Releases are signed with the project's own key; without it, the debug key (for local builds and CI).
            signingConfig releaseKey != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No libraries in the APK. Test only: plain JVM tests in src/test.
    testImplementation 'junit:junit:4.13.2'
}
